<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="div1">
            <h1>Cadastre um Aluno!</h1>
        </div>
    </div>
    <div class="container2">
        <div class="container_formulario">
            <form action="http://localhost/autoescola/back/index.php" method="post">
                <input type="text" name="nome_aluno" placeholder="Nome"/>
                <br>
                <input type="text" name="email_aluno" placeholder="Email"/>
                <br>
                <input type="text" name="telefone_aluno" placeholder="Telefone"/>
                <br>
                <h4>Data de nascimento:</h4>
                <input type="date" name="data_nascimento_aluno" placeholder="Data de nascimento"/>
                <br>
                <input type="submit" value="Enviar" id="botao"/>
            </form>
        </div>
    </div>
</body>
</html>
